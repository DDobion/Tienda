<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo · FORJA ·09</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/diseñolanding.css">
    <link rel="stylesheet" href="css/catalogo.css">
</head>

<body>

    <div id="navbar"></div>

    <!-- coso del catálogo -->
    <section class="catalogo-encabezado">

        <div class="etiqueta">
            • Catálogo completo · FORJA ·09
        </div>

        <h1>
            Cada pieza, forjada<br>
            bajo el mismo estándar.
        </h1>

        <p>
            Filtra por línea de producto o revisa el catálogo completo.
            Cada caja abre la ficha técnica de la pieza.
        </p>

    </section>

    <!-- filtros de categorias -->
    <section class="catalogo-filtros">

        <div class="filtros">
            <button class="filtro activo" data-categoria="todos">Todas</button>
            <button class="filtro" data-categoria="ad">Daño Físico (AD)</button>
            <button class="filtro" data-categoria="ap">Poder de Habilidad (AP)</button>
            <button class="filtro" data-categoria="def">Defensa y Tanque</button>
            <button class="filtro" data-categoria="sup">Soporte y Utilidad</button>
            <button class="filtro" data-categoria="mov">Movilidad</button>
        </div>

    </section>

    <!-- cuadros de productos -->
    <section class="catalogo-lista">

        <div class="grid-productos" id="gridProductos">
            
        </div>

        <p class="catalogo-vacio" id="catalogoVacio">
            No hay piezas en esta línea todavía.
        </p>

    </section>

    <div id="footer"></div>

   
    <script>
        fetch("navbar.html")
            .then(r => r.text())
            .then(data => document.getElementById("navbar").innerHTML = data);
        fetch("footer.html")
            .then(r => r.text())
            .then(data => document.getElementById("footer").innerHTML = data);
    </script>

    
    <script src="js/catalogo-render.js"></script>

</body>

</html>
