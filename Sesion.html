<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · FORJA ·09</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/diseñolanding.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body class="pagina-auth">

    <div class="auth-contenedor">

        <div class="auth-tarjeta">

            <h1>Iniciar sesión</h1>
            <p class="auth-subtitulo">
                Ingresa para ver tu perfil y el historial de tus encargos.
            </p>

            <form id="formularioLogin" class="auth-formulario">

                <div class="campo">
                    <label for="correoLogin">Usuario o Correo</label>
                    <!-- Cambiado de type="email" a type="text" para evitar la validación obligatoria del @ -->
                    <input type="text" id="correoLogin" name="correo" placeholder="admin, cliente o correo@dominio.com">
                </div>

                <div class="campo">
                    <label for="contrasenaLogin">Contraseña</label>
                    <input type="password" id="contrasenaLogin" name="contrasena" placeholder="••••••••">
                </div>

                <button type="submit" class="auth-boton">Entrar</button>

                <div class="auth-mensaje" id="mensajeLogin">
                    ✓ Sesión iniciada. Bienvenido de vuelta.
                </div>

            </form>

            <p class="auth-alterno">
                ¿Aún no tienes cuenta? <a href="registro.html">Regístrate</a>
            </p>

        </div>

    </div>

<script>
    const formularioLogin = document.getElementById("formularioLogin");
    const mensajeLogin = document.getElementById("mensajeLogin");
    const correoInput = document.getElementById("correoLogin");

    formularioLogin.addEventListener("submit", (evento) => {
        evento.preventDefault();

        const correo = correoInput.value.trim().toLowerCase();
        const esAdmin = correo.includes("admin");

        if (esAdmin) {
            localStorage.setItem("sesion", "admin");
            mensajeLogin.innerText = "✓ Modo Administrador detectado. Entrando...";
        } else {
            localStorage.setItem("sesion", "cliente");
            mensajeLogin.innerText = "✓ Sesión iniciada. Bienvenido Invocador.";
        }

        mensajeLogin.classList.add("mostrar");

        setTimeout(() => {
            if (esAdmin) {
                window.location.href = "admin.html";
            } else {
                window.location.href = "cuenta.html";
            }
        }, 1200);
    });
</script>

</body>

</html>
